services:
  otp-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: otp-service:latest
    container_name: otp-service
    ports:
      - "8080:8080"
    environment:
      JAVA_OPTS: "-XX:MaxRAMPercentage=75"
      SERVER_PORT: "8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true